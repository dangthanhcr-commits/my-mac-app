name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# KHAI BÁO TÊN FILE TẠI ĐÂY (Chỉ cần sửa dòng này cho các lần cập nhật sau)
env:
  PYTHON_SCRIPT: "tkb_lbg_filter_24-10.py"

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt thư viện phụ thuộc
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Đóng gói bằng PyInstaller
      run: |
        # Lấy tên file từ biến môi trường đã khai báo ở trên
        pyinstaller --noconfirm --onefile --windowed ${{ env.PYTHON_SCRIPT }}

    - name: Nén file .app thành .zip
      run: |
        cd dist
        # Tự động nén bất kỳ ứng dụng .app nào được tạo ra, không lo sai tên
        zip -r phan_mem_macOS.zip *.app

    - name: Tải file phần mềm lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: phan_mem_macOS
        path: dist/phan_mem_macOS.zip

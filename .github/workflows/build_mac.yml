name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]  # Tự động chạy khi bạn push code lên branch main hoặc master
  workflow_dispatch:               # Cho phép nhấn nút chạy thủ công trên GitHub

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt thư viện phụ thuộc
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Đóng gói bằng PyInstaller
      run: |
        # Thay "tên_file_cập_nhật.py" thành tên đúng của file Python mới
        pyinstaller --noconfirm --onefile --windowed tên_file_cập_nhật.py

    - name: Nén file .app thành .zip
      run: |
        cd dist
        # Dùng *.app để tự động nén ứng dụng vừa đóng gói mà không sợ sai tên
        zip -r phan_mem_macOS.zip *.app

    - name: Tải file phần mềm lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: phan_mem_macOS
        path: dist/phan_mem_macOS.zip

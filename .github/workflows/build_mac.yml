name: Build macOS App

on:
  push:
    branches: [ "main", "master" ]  # Tự động chạy khi bạn push code lên branch main hoặc master
  workflow_dispatch:               # Cho phép nhấn nút chạy thủ công trên GitHub

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt thư viện phụ thuộc
      run: |
        python -m pip install --upgrade pip
        pip install openpyxl pyinstaller

    - name: Đóng gói bằng PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed tkb_lbg_filter_24-10.py

    - name: Nén file .app thành .zip
      run: |
        cd dist
        zip -r tkb_lbg_filter_22-9.zip tkb_lbg_filter_22-9.app

    - name: Tải file phần mềm lên GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: tkb_lbg_filter_macOS
        path: dist/tkb_lbg_filter_22-9.zip
